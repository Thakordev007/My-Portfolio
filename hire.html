<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hire Me Form</title>

  <style>
    :root {
      --bg: #0f1724;
      --card: #0b1220;
      --accent1: #6EE7B7;
      --accent2: #60A5FA;
      --muted: #94A3B8;
      --glass: rgba(255, 255, 255, 0.04);
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: linear-gradient(180deg, #061226 0%, #081426 60%);
      color: #e6eef8;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 980px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.6);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .side {
      padding: 36px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0));
      border-right: 1px solid rgba(255, 255, 255, 0.03);
    }

    .side h1 {
      margin: 0 0 8px;
      font-size: 22px
    }

    .side p {
      color: var(--muted);
      margin: 0 0 20px;
      line-height: 1.5
    }

    .form-wrap {
      padding: 36px;
    }

    form {
      display: grid;
      gap: 14px;
    }

    .row {
      display: flex;
      gap: 12px
    }

    .col {
      flex: 1
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #d9eefc;
      font-weight: 600;
    }

    input[type="text"],
    input[type="email"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--glass);
      border: 1px solid rgba(255, 255, 255, 0.03);
      color: inherit;
      outline: none;
      font-size: 14px;
      resize: vertical;
      min-height: 44px;
    }

    textarea {
      min-height: 120px
    }

    input:focus,
    textarea:focus {
      box-shadow: 0 6px 18px rgba(96, 165, 250, 0.08),
        inset 0 0 0 1px rgba(96, 165, 250, 0.12);
      border-color: rgba(96, 165, 250, 0.7);
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: -1px
    }

    .submit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      background: linear-gradient(90deg, var(--accent2), var(--accent1));
      color: #022235;
      padding: 12px 18px;
      border-radius: 10px;
      border: 0;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(96, 165, 250, 0.12);
    }

    .btn:active {
      transform: translateY(1px)
    }

    .small-muted {
      color: var(--muted);
      font-size: 13px
    }

    @media(max-width:880px) {
      body {
        padding: 20px;
      }

      .container {
        grid-template-columns: 1fr;
        max-width: 640px;
      }

      .side {
        border-right: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        padding: 28px 24px;
        text-align: center;
      }

      .side h1 {
        font-size: 20px;
      }

      .side p {
        font-size: 14px;
      }

      .form-wrap {
        padding: 28px 24px;
      }

      .row {
        flex-direction: column;
      }
    }

    @media(max-width:480px) {
      body {
        padding: 16px;
      }

      .side h1 {
        font-size: 18px;
      }

      input,
      textarea {
        font-size: 15px;
      }

      label {
        font-size: 12px;
      }

      .btn {
        width: 100%;
        text-align: center;
      }
    }

    #status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      text-align: center;
    }

    .back button {
      position: relative;
      bottom: 30px;
      border-radius: 50px;
      -webkit-background-clip: text;
      color: transparent;
    }
  </style>


  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>

<body>
  <div class="container" role="region" aria-label="Hire Me form">

    <aside class="side">
      <a href="index.html">
        <div class="back"><button>❌</button></div>
      </a>

      <h1>Hire Me</h1>
      <p>✨ I am a fresher actively seeking job opportunities. Please fill out this form with your details.</p>
      <dl>
        <dt class="small-muted">Response time</dt>
        <dd>Usually 1–3 business days</dd>
        <dt class="small-muted">What to include</dt>
        <dd>Job role, company details, expected joining date</dd>
      </dl>
    </aside>

    <div class="form-wrap">
      <form id="hireForm">
        <div class="row">
          <div class="col">
            <label for="company">Company Name</label>
            <input id="company" name="company" type="text" placeholder="Company Name" required />
          </div>
          <div class="col">
            <label for="hrname">HR / Recruiter Name</label>
            <input id="hrname" name="hrname" type="text" placeholder="Recruiter Name" required />
          </div>
        </div>

        <div>
          <label for="email">Official Email</label>
          <input id="email" name="email" type="email" placeholder="hr@company.com" required />
        </div>

        <div>
          <label for="position">Job Role / Position</label>
          <input id="position" name="position" type="text" placeholder="Frontend / Backend Developer" required />
        </div>

        <div>
          <label for="message">Additional Details</label>
          <textarea id="message" name="message" placeholder="Job description, skills required, salary package, etc..."
            required></textarea>
        </div>

        <div class="row">
          <div class="col">
            <label for="deadline">Expected Joining Date</label>
            <input id="deadline" name="deadline" type="text" placeholder="e.g. 2025-10-15" />
          </div>
          <div class="col">
            <label for="location">Job Location</label>
            <input id="location" name="location" type="text" placeholder="Ahmedabad / Remote" required />
          </div>
        </div>

        <div>
          <label for="offer">Attachment (Offer letter / JD) — optional</label>
          <input id="offer" name="offer" type="file" accept=".pdf,.doc,.docx" />
        </div>

        <div class="submit-row">
          <div class="small-muted">Fields marked required need to be filled.</div>
          <button class="btn" type="submit">Submit Details</button>
        </div>
        <div id="status"></div>
      </form>
    </div>
  </div>

  <script>

    (function () { emailjs.init("b6uNjXh5tWj2-mp6n"); })();

    const form = document.getElementById('hireForm');
    const statusBox = document.getElementById('status');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      statusBox.style.display = 'block';
      statusBox.style.background = '#60A5FA';
      statusBox.style.color = '#fff';
      statusBox.textContent = '📧 Sending email...';

      emailjs.sendForm('service_ct0o60i', 'template_ca1a0ej', this)
        .then(function () {
          statusBox.style.background = '#6EE7B7';
          statusBox.style.color = '#022235';
          statusBox.textContent = '✅ Message sent successfully!';
          form.reset();
        }, function (error) {
          statusBox.style.background = '#ef4444';
          statusBox.style.color = '#fff';
          statusBox.textContent = '❌ Failed to send: ' + error.text;
        });
    });
  </script>
</body>

</html>
